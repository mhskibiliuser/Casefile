name: Fix Casefile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch navigation robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Hash navigation fallback. Only a top-level .screen target should
          # switch screens; inner dashboard anchors such as #dash-interrogation
          # must NOT hide the dashboard.
          s = s.replace(
              'body:has(.screen:target) .screen.active:not(:target)',
              'body:has(> main > .screen:target) .screen.active:not(:target)'
          )

          # Repair malformed closing tag left on the landing Archive link.
          s = s.replace(
              '<a class="btn btn-primary" data-goto="screen-archive" href="#screen-archive">Open the Archive <i class="ti ti-arrow-right"></i></button>',
              '<a class="btn btn-primary" data-goto="screen-archive" href="#screen-archive">Open the Archive <i class="ti ti-arrow-right"></i></a>'
          )

          # Landing-page Archive button -> real hash link.
          archive_re = re.compile(r'<button(?=[^>]*class=["\'][^"\']*btn-primary[^"\']*["\'])(?=[^>]*data-goto=["\']screen-archive["\'])[^>]*>(.*?)</button>', re.S)
          s, archive_n = archive_re.subn(r'<a class="btn btn-primary" data-goto="screen-archive" href="#screen-archive">\1</a>', s, count=1)

          # Begin Investigation -> dashboard hash link, independent of JS.
          begin_re = re.compile(r'<button(?=[^>]*onclick=["\']beginInvestigation\(\)["\'])[^>]*>(.*?)</button>', re.S)
          s, begin_n = begin_re.subn(r'<a class="btn btn-primary" data-goto="screen-dashboard" href="#screen-dashboard">\1</a>', s, count=1)

          # Repair any remaining malformed anchor/button nesting.
          s = s.replace('</button></a>', '</a>')

          p.write_text(s, encoding='utf-8')
          print(f'archive replacements: {archive_n}, begin replacements: {begin_n}')
          if 'href="#screen-dashboard"' not in s:
              raise SystemExit('ERROR: dashboard navigation link was not created')
          if 'href="#screen-archive"' not in s:
              raise SystemExit('ERROR: archive navigation link was not created')
          if 'body:has(> main > .screen:target)' not in s:
              raise SystemExit('ERROR: nested dashboard anchor selector was not repaired')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep dashboard visible on internal navigation'
          git fetch origin main
          git rebase origin/main || (git rebase --abort; git reset --hard origin/main)
          git push origin HEAD:main
