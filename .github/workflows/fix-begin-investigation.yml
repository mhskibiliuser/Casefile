name: Fix Casefile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final interaction patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # The reveal curtain must never be able to sit above the app and block clicks.
          emergency_css = '<style id="CASEFILE-EMERGENCY-UI">.curtain{transform:translateY(-100%)!important;pointer-events:none!important;display:none!important}</style>'
          if 'CASEFILE-EMERGENCY-UI' not in s:
              s = s.replace('</head>', emergency_css + '\n</head>', 1)

          # Force the page into its usable state even if another script fails before load.
          emergency_js = r'''<script id="CASEFILE-EMERGENCY-INTERACTIONS">
          (function(){
            document.documentElement.classList.add('js','is-loaded');
            function boot(){
              var f=document.getElementById('interrogationForm');
              var i=document.getElementById('questionInput');
              var a=document.getElementById('askBtn');
              var c=document.getElementById('convoArea');
              var q=document.getElementById('qRemaining');
              var qe=document.getElementById('qRemainingEcho');
              if(!f||!i||!a||!c)return;
              if(f.dataset.finalPatch==='1')return;
              f.dataset.finalPatch='1';
              var tabs=document.querySelectorAll('.interrogation-tab');
              var state={who:'ethan',left:3,logs:{ethan:[],maya:[],noah:[]}};
              var people={ethan:['Ethan Cole',['I was at the ticket table. Ask the freshmen I checked in.','A few minutes, maybe. Long enough to grab more zip ties from the closet.','I wanted that trophy front and center. That is not a crime.']],maya:['Maya Lin',['I was hanging streamers. Alone, yes, but that was decorating for you.','I left for the stage around 21:35. I did not look back.','That lock was a joke. I said so to three different people that week.']],noah:['Noah Reed',['I was hauling tables through that corridor all night. Ask anyone.','My boots? I was outside setting up the courtyard entrance too.','I did not go near the display case. Why would I?'] ]};
              function esc(x){var d=document.createElement('div');d.textContent=x;return d.innerHTML}
              function render(){var log=state.logs[state.who];if(!log.length){c.innerHTML='<p class="convo-empty">No questions asked yet. Choose a suspect and ask your first question below.</p>';return}var n=people[state.who][0];c.innerHTML=log.map(function(x){return '<div class="msg msg-q"><span class="msg-label">You</span>'+esc(x.q)+'</div><div class="msg msg-a"><span class="msg-label">'+n+'</span>'+esc(x.a)+'</div>'}).join('');c.scrollTop=c.scrollHeight}
              function update(){q.textContent=state.left;if(qe)qe.textContent=state.left;i.disabled=state.left<1;a.disabled=state.left<1;i.placeholder=state.left?'Ask a question...':'No questions remaining.'}
              function replaceTabs(){tabs=document.querySelectorAll('.interrogation-tab');tabs.forEach(function(t){var n=t.cloneNode(true);t.parentNode.replaceChild(n,t)});tabs=document.querySelectorAll('.interrogation-tab');tabs.forEach(function(t){t.addEventListener('click',function(){tabs.forEach(function(x){x.classList.remove('active')});t.classList.add('active');state.who=t.dataset.suspect||'ethan';render()})})}
              var nf=f.cloneNode(true);f.parentNode.replaceChild(nf,f);f=nf;i=document.getElementById('questionInput');a=document.getElementById('askBtn');
              replaceTabs();
              f.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation();if(state.left<1)return;var text=i.value.trim();if(!text)return;var log=state.logs[state.who],lines=people[state.who][1];log.push({q:text,a:lines[log.length]||'I have already told you everything I know.'});state.left--;i.value='';render();update()});
              update();render();
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            setTimeout(boot,1000);setTimeout(boot,2500);
          })();
          </script>'''
          if 'CASEFILE-EMERGENCY-INTERACTIONS' not in s:
              s = s.replace('</body>', emergency_js + '\n</body>', 1)

          s = s.replace('body:has(.screen:target) .screen.active:not(:target)','body:has(> main > .screen:target) .screen.active:not(:target)')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: remove blocking curtain and harden interactions' && git push origin HEAD:main)
