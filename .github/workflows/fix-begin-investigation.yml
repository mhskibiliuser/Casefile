name: Fix Casefile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install interrogation handler
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); tag='<script src=\"interrogation-fix.js\"></script>'; s=s.replace('</body>',tag+'\\n</body>',1) if tag not in s else s; s=s.replace('body:has(.screen:target) .screen.active:not(:target)','body:has(> main > .screen:target) .screen.active:not(:target)'); p.write_text(s)"
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: install working interrogation controls' && git push origin HEAD:main)
