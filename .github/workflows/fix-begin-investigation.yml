name: Fix Begin Investigation button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch button fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="btn btn-primary" onclick="beginInvestigation()">'
          new = '<button type="button" class="btn btn-primary" data-goto="screen-dashboard" onclick="try{beginInvestigation()}catch(e){document.querySelectorAll(\'.screen\').forEach(function(s){s.classList.remove(\'active\')});document.getElementById(\'screen-dashboard\').classList.add(\'active\');window.scrollTo(0,0)}">'
          if old not in s:
              print('Button already patched or pattern not found; nothing to do.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make Begin Investigation navigation resilient'
          git push