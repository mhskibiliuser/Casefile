name: Fix Casefile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch navigation robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # CSS fallback: navigation still works if page JS is unavailable.
          css = '.screen:target{display:block!important}body:has(.screen:target) .screen.active:not(:target){display:none!important}'
          if css not in s:
              s = s.replace('.screen.active{display:block}', '.screen.active{display:block}' + css, 1)

          # Landing-page Archive button -> real hash link.
          archive_re = re.compile(r'<button(?=[^>]*class=["\'][^"\']*btn-primary[^"\']*["\'])(?=[^>]*data-goto=["\']screen-archive["\'])[^>]*>(.*?)</button>', re.S)
          s, archive_n = archive_re.subn(r'<a class="btn btn-primary" data-goto="screen-archive" href="#screen-archive">\1</a>', s, count=1)

          # Begin Investigation -> dashboard hash link, independent of JS.
          begin_re = re.compile(r'<button(?=[^>]*onclick=["\']beginInvestigation\(\)["\'])[^>]*>(.*?)</button>', re.S)
          s, begin_n = begin_re.subn(r'<a class="btn btn-primary" data-goto="screen-dashboard" href="#screen-dashboard">\1</a>', s, count=1)

          # If the original button has already been partially patched, repair it too.
          if begin_n == 0:
              s = re.sub(r'<button([^>]*data-goto=["\']screen-dashboard["\'][^>]*)>(\s*Begin Investigation.*?</button>)', r'<a class="btn btn-primary" data-goto="screen-dashboard" href="#screen-dashboard">\2</a>', s, count=1, flags=re.S)
              s = s.replace('</button></a>', '</a>')

          p.write_text(s, encoding='utf-8')
          print(f'archive replacements: {archive_n}, begin replacements: {begin_n}')
          if 'href="#screen-dashboard"' not in s:
              raise SystemExit('ERROR: dashboard navigation link was not created')
          if 'href="#screen-archive"' not in s:
              raise SystemExit('ERROR: archive navigation link was not created')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make investigation navigation reliable'
          git fetch origin main
          git rebase origin/main || (git rebase --abort; git reset --hard origin/main; git apply --whitespace=nowarn < <(git diff HEAD^ HEAD) || true)
          git push origin HEAD:main
